<?xml version="1.0" encoding="UTF-8"?>
<!--
  besoq — Apple touch icon (180×180 production size)
  v1.0
  
  iOS recommends 180×180 with the background painted (because iOS does not
  add a default mask). The image is set to bone, with the wordmark "besoq"
  centred — not the monogram, because the canvas is large enough.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 180 180"
     role="img"
     aria-label="besoq">
  <title>besoq</title>
  <rect width="180" height="180" fill="#F4EFE6"/>
  <text x="90" y="105"
        text-anchor="middle"
        font-family="Söhne, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="36"
        font-weight="400"
        letter-spacing="4.32"
        fill="#1A1A1A">besoq</text>
</svg>
