<?xml version="1.0" encoding="UTF-8"?>
<!--
  besoq — favicon, dark variant
  v1.0
  
  Bone monogram on Ash background. Used for dark-mode favicons via the
  prefers-color-scheme media query in the host page's <link>.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     role="img"
     aria-label="besoq">
  <title>besoq</title>
  <rect width="256" height="256" fill="#1A1A1A"/>
  <text x="128" y="160"
        text-anchor="middle"
        font-family="Söhne, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="120"
        font-weight="400"
        letter-spacing="14.4"
        fill="#F4EFE6">bsq</text>
</svg>
