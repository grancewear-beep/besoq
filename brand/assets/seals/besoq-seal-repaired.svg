<?xml version="1.0" encoding="UTF-8"?>
<!--
  besoq — repair-service seal
  v1.0
  
  A variant of the standard seal, used on the slip that accompanies
  a garment returned from the repair atelier. Adds a small ".repaired"
  inscription on the inner ring.
  
  Reference: brand/05-product/03-care-and-repair.md
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200"
     role="img"
     aria-label="besoq repaired seal">
  <title>besoq · repaired</title>
  <desc>besoq seal variant for repair-returned garments</desc>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96"
          fill="none"
          stroke="#1A1A1A"
          stroke-width="1"/>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="86"
          fill="none"
          stroke="#1A1A1A"
          stroke-width="0.5"/>

  <!-- Wordmark -->
  <text x="100" y="98"
        text-anchor="middle"
        font-family="Söhne, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="22"
        font-weight="400"
        letter-spacing="2.64"
        fill="#1A1A1A">besoq</text>

  <!-- Inscription -->
  <text x="100" y="124"
        text-anchor="middle"
        font-family="Söhne, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="9"
        font-weight="400"
        letter-spacing="1.8"
        fill="#3C3C3C">repaired</text>
</svg>
