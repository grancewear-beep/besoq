<?xml version="1.0" encoding="UTF-8"?>
<!--
  besoq — primary wordmark
  v1.0
  
  Lowercase. Letter-spacing 0.12em. Ash (#1A1A1A) on transparent.
  Reference: brand/03-visual/01-logo-system.md
  
  Type: Söhne Buch when licensed; Inter Regular as the deployed fallback.
  Clear space (2x the e-height) is built into the viewBox padding.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 480 160"
     role="img"
     aria-label="besoq">
  <title>besoq</title>
  <desc>besoq wordmark, lowercase, primary form</desc>
  <text x="240" y="100"
        text-anchor="middle"
        font-family="Söhne, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="80"
        font-weight="400"
        letter-spacing="9.6"
        fill="#1A1A1A">besoq</text>
</svg>
